version: "3.7"

services:
  proxy:
    container_name: hmd_proxy
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - neuronsphere_default
    volumes:
      - "${HMD_HOME}/.cache/nginx/neuronsphere.conf:/etc/nginx/nginx.conf:ro"

  db:
    container_name: hmd_db
    environment:
      HMD_CUSTOMER_CODE: ${HMD_CUSTOMER_CODE}
      HMD_DID: ${HMD_DID:-aaa}
      HMD_ENVIRONMENT: local
      HMD_REGION: ${HMD_REGION}
    image: ${HMD_LOCAL_NS_CONTAINER_REGISTRY:-ghcr.io/neuronsphere}/hmd-postgres-base:${HMD_POSTGRES_BASE_VERSION:-stable}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - neuronsphere_default
    volumes:
      - type: bind
        source: ${HMD_HOME}/postgresql/data
        target: /var/lib/postgresql/data
      - type: bind
        source: ${HMD_HOME}/postgresql/scripts/always-initdb.d
        target: /docker-entrypoint-initdb.d

  floci:
    image: floci/floci:1.5.8
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_SERVICES: s3,dynamodb,sqs,lambda,apigateway,iam,ecr,eks,secretsmanager
      FLOCI_STORAGE_MODE: persistent
      FLOCI_LAMBDA_EXECUTOR: docker
      FLOCI_DEFAULT_REGION: ${AWS_REGION:-us-west-2}
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_DOCKER_NETWORK: neuronsphere_default
      FLOCI_SERVICES_EKS_DOCKER_NETWORK: neuronsphere_default
      FLOCI_SERVICES_EKS_MOCK: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummykey}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummykey}
    volumes:
      - "${HMD_HOME}/floci/data:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_floci/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - neuronsphere_default

  floci-workload:
    image: floci/floci:1.5.8
    container_name: floci-workload
    ports:
      - "4567:4566"
    environment:
      FLOCI_SERVICES: s3,dynamodb,sqs,lambda,apigateway,iam,secretsmanager,rds,ecr
      FLOCI_STORAGE_MODE: persistent
      FLOCI_LAMBDA_EXECUTOR: docker
      FLOCI_DEFAULT_REGION: ${AWS_REGION:-us-west-2}
      FLOCI_DEFAULT_ACCOUNT_ID: "654654218804"
      FLOCI_HOSTNAME: floci-workload
      FLOCI_SERVICES_DOCKER_NETWORK: neuronsphere_default
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummykey}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummykey}
    volumes:
      - "${HMD_HOME}/floci/workload-data:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_floci/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - neuronsphere_default

  db_init:
    command: psql -h db --username postgres -a --dbname "postgres" -f /root/sql/db_init.sql
    container_name: hmd-ms-naming_db_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: admin
    image: ${HMD_LOCAL_NS_CONTAINER_REGISTRY:-ghcr.io/neuronsphere}/hmd-postgres-base:${HMD_POSTGRES_BASE_VERSION:-stable}
    volumes:
      - source: ./naming/db_init.sql
        target: /root/sql/db_init.sql
        type: bind
    networks:
      - neuronsphere_default

  db_init_deployment:
    command: psql -h db --username postgres -a --dbname "postgres" -f /root/sql/db_init.sql
    container_name: hmd-ms-deployment_db_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: admin
    image: ${HMD_LOCAL_NS_CONTAINER_REGISTRY:-ghcr.io/neuronsphere}/hmd-postgres-base:${HMD_POSTGRES_BASE_VERSION:-stable}
    volumes:
      - source: ./deployment/db_init.sql
        target: /root/sql/db_init.sql
        type: bind
    networks:
      - neuronsphere_default

networks:
  neuronsphere_default:
    external: true
