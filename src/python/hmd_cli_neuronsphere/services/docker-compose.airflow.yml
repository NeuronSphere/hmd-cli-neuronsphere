version: "3.2"
services:
  airflow-scheduler:
    container_name: hmd_airflow_scheduler
    image: ${HMD_CONTAINER_REGISTRY}/hmd-img-airflow:${HMD_IMG_AIRFLOW_SERVER_VERSION}
    entrypoint: /opt/airflow/entrypoint.sh
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@hmd_db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
      AIRFLOW_CONN_TRINO_CONN: trino://trino@trino:8081/hive
    volumes:
      - type: bind
        source: ${HMD_HOME}/transform/airflow/logs
        target: /opt/airflow/logs
      - type: bind
        source: ${HMD_HOME}/transform/airflow/provider_transforms
        target: /opt/airflow/provider_transforms
      # - provider_transforms:/opt/airflow/provider_transforms
    depends_on:
      - db

  airflow-webserver:
    container_name: hmd_airflow_webserver
    image: ${HMD_CONTAINER_REGISTRY}/hmd-img-airflow:${HMD_IMG_AIRFLOW_SERVER_VERSION}
    command: webserver
    ports:
      - 175:8080
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@hmd_db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
      AIRFLOW_CONN_TRINO_CONN: trino://trino@trino:8081/hive
    volumes:
      - type: bind
        source: ${HMD_HOME}/transform/airflow/logs
        target: /opt/airflow/logs
      - type: bind
        source: ${HMD_HOME}/transform/airflow/provider_transforms
        target: /opt/airflow/provider_transforms
      # - provider_transforms:/opt/airflow/provider_transforms
    depends_on:
      - db
      - airflow-scheduler

