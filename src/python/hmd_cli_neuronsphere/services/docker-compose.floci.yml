version: "3.7"

services:
  floci:
    image: floci/floci:1.5.8
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_SERVICES: s3,dynamodb,sqs,lambda,apigateway,ecr,eks,secretsmanager
      FLOCI_STORAGE_MODE: persistent
      FLOCI_LAMBDA_EXECUTOR: docker
      FLOCI_DEFAULT_REGION: ${AWS_REGION:-us-west-2}
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_DOCKER_NETWORK: neuronsphere_default
      FLOCI_SERVICES_EKS_DOCKER_NETWORK: neuronsphere_default
      FLOCI_SERVICES_EKS_MOCK: "false"
      # Floci 1.5.8 hardcodes --kube-apiserver-arg=storage-backend=sqlite3 when
      # spawning k3s, but kube-apiserver only accepts etcd3 (kine speaks etcd3
      # regardless of the underlying SQLite store), so the node exits on startup.
      # The hmd-img-k3s-floci image's entrypoint drops the bad flag.
      FLOCI_SERVICES_EKS_DEFAULT_IMAGE: ${HMD_LOCAL_K3S_WRAPPER_IMAGE:-${HMD_LOCAL_NS_CONTAINER_REGISTRY:-ghcr.io/neuronsphere}/hmd-img-k3s-floci:0.2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummykey}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummykey}
    volumes:
      - "${HMD_HOME}/floci/data:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_floci/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Register the canonical NeuronSphere-branded hostname as a Docker
    # network alias so in-network services and presigned URLs can resolve
    # `neuronsphere` instead of the underlying tool name `floci`. Host-side
    # resolution requires a matching /etc/hosts entry (see readme).
    networks:
      neuronsphere_default:
        aliases:
          - neuronsphere
