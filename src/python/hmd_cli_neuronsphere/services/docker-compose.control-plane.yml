version: "3.7"

services:
  # The ONLY container in the whole local stack that publishes host ports.
  # Everything else -- the control-plane Floci, every environment's Floci,
  # Postgres, JanusGraph, Trino -- is reached through here, either as an HTTP
  # location or an L4 stream. That is what lets several environments coexist on
  # one machine without colliding.
  proxy:
    container_name: hmd_proxy
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Streamed to the control-plane floci container. Keeps `neuronsphere:4566`
      # (the hostname baked into presigned S3/API URLs, mapped to 127.0.0.1 in
      # the host's /etc/hosts) working now that Floci publishes nothing itself.
      - "4566:4566"
      # Durable host route to the default environment's k3s Trino coordinator,
      # kept at its historical port so existing integration tests are unaffected.
      - "${HMD_LOCAL_TRINO_HOST_PORT:-18080}:${HMD_LOCAL_TRINO_HOST_PORT:-18080}"
      # Per-environment stream listeners: the slot ports (Floci, Trino, graph,
      # spare) plus the k3s API band above them. A compose `ports:` list is
      # static, so the whole range is published up front and individual listeners
      # inside it are added/removed at runtime with an nginx reload -- no
      # restart. See env_registry.env_port_range().
      - "${HMD_LOCAL_ENV_PORT_RANGE:-19000-19079}:${HMD_LOCAL_ENV_PORT_RANGE:-19000-19079}"
    networks:
      - neuronsphere_default
    volumes:
      - "${HMD_HOME}/.cache/nginx/neuronsphere.conf:/etc/nginx/nginx.conf:ro"
      # Directory bind so route fragments added/removed at runtime are visible
      # without recreating the container (see nginx_router).
      - "${HMD_HOME}/.cache/nginx:/etc/nginx/ns:ro"

  # Single Floci environment (control plane == workload account). The former
  # split admin/workload Floci instances were collapsed into this one; the
  # `neuronsphere-workload` network alias is retained so in-network consumers
  # that still address `neuronsphere-workload:4566` resolve to this instance.
  floci:
    image: floci/floci:${HMD_LOCAL_FLOCI_VERSION:-2.0.1}
    container_name: floci
    # No host port: reached from the host via hmd_proxy's :4566 stream, so that
    # every published port on this machine belongs to exactly one container.
    environment:
      # Union of the former admin (eks) and workload (rds) service sets. No
      # `ecr`: Lambda images resolve straight from the host's Docker image
      # cache (see floci_deployer._ensure_local_image), so nothing ever
      # pushes to or reads from Floci's ECR sidecar -- omitting the service
      # here stops Floci from spawning it (`floci-ecr-registry`) at all.
      FLOCI_SERVICES: s3,dynamodb,sqs,lambda,apigateway,iam,eks,secretsmanager,rds
      # Persistent state lives in ${HMD_HOME}/floci/data. Caveat: Floci writes
      # every API Gateway *v1* entity (apigateway-*.json) with all-null fields
      # and, as of 1.5.34, rehydrates those records on start -- so a restart
      # serves back nameless, undeletable gateways. `prune_apigateway_ghosts`
      # drops just those records on every `up`, keeping the real gateways (a
      # DAG-deployed service's is CDKTF-managed and never recreated here). Every other service (lambda, s3, secretsmanager, iam, eks,
      # apigatewayv2) persists correctly.
      FLOCI_STORAGE_MODE: persistent
      # Floci 1.7.0: the spawned k3s container's own volume (its
      # /var/lib/rancher/k3s datastore) now survives a Floci restart instead
      # of being torn down automatically -- see the k3s-cluster-persistence
      # note in docs/modes.rst. KEEP_RUNNING_ON_SHUTDOWN stays false because
      # `stop_k3s_cluster` already stops the k3s container explicitly on a
      # plain `down`; we only need the volume (not the running container) to
      # survive so the next `up` re-adopts the same cluster/kube-system UID.
      FLOCI_SERVICES_EKS_KEEP_RUNNING_ON_SHUTDOWN: "false"
      FLOCI_STORAGE_PRUNE_VOLUMES_ON_DELETE: "false"
      FLOCI_LAMBDA_EXECUTOR: docker
      FLOCI_DEFAULT_REGION: ${AWS_REGION:-us-west-2}
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      # The explicit network alias below, never the `floci` service key: Compose
      # registers each service key as an alias in every project on the network,
      # and docker-compose.environment.yml keys its Floci `floci` too -- so
      # `floci` round-robins between this container and every environment's.
      # Floci bakes this name into the invoke/endpoint URLs it hands back.
      FLOCI_HOSTNAME: neuronsphere
      FLOCI_SERVICES_DOCKER_NETWORK: ${NEURONSPHERE_DOCKER_NETWORK:-neuronsphere_default}
      FLOCI_SERVICES_EKS_DOCKER_NETWORK: ${NEURONSPHERE_DOCKER_NETWORK:-neuronsphere_default}
      # RDS: Floci runs a real postgres container per DB instance. Pinning the
      # image keeps local parity with what `hmd-postgres-base` provides
      # (extensions, the baked dbs_init.sh) instead of Floci's postgres:16-alpine
      # default. It must stay pinned: Floci recreates the backend container from
      # the *current* value on every start while reusing the instance's named
      # volume, so changing the postgres major version fails the container with
      # "database files are incompatible" and needs a purge.
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: ${HMD_LOCAL_NS_CONTAINER_REGISTRY:-ghcr.io/neuronsphere}/hmd-postgres-base:${HMD_POSTGRES_BASE_VERSION:-stable}
      FLOCI_SERVICES_RDS_DOCKER_NETWORK: ${NEURONSPHERE_DOCKER_NETWORK:-neuronsphere_default}
      # Floci emulates a Neptune cluster by spawning a real gremlin-server
      # container, and this is the image it spawns. The stock TinkerPop image is
      # unusable as a Neptune backend: it runs TinkerGraph in memory (nothing
      # persists) with a LONG id manager that rejects the string NIDs
      # hmd-entity-storage writes. hmd-img-gremlin-server 0.3.5 is built on
      # TinkerPop with `*IdManager=ANY`, a persisted graphLocation and a
      # shutdown hook that actually writes it -- see that repo's CHANGELOG.
      # Pinned, not floating: Floci recreates the backend container from the
      # current value, and the graph lives in that container's writable layer.
      FLOCI_SERVICES_NEPTUNE_DEFAULT_IMAGE: ${HMD_LOCAL_NS_CONTAINER_REGISTRY:-ghcr.io/neuronsphere}/hmd-img-gremlin-server:${HMD_IMG_GREMLIN_SERVER_VERSION:-0.3.5}
      FLOCI_SERVICES_NEPTUNE_DOCKER_NETWORK: ${NEURONSPHERE_DOCKER_NETWORK:-neuronsphere_default}
      FLOCI_SERVICES_EKS_MOCK: "false"
      # Spawn k3s from the hmd-img-k3s-floci wrapper, whose entrypoint drops the
      # two broken kube-apiserver overrides Floci injects
      # (--kube-apiserver-arg=storage-backend=sqlite3 and etcd-servers=unix:///tmp/kine.sock)
      # that otherwise crash-loop the apiserver ("--storage-backend invalid").
      FLOCI_SERVICES_EKS_DEFAULT_IMAGE: ${HMD_LOCAL_K3S_WRAPPER_IMAGE:-${HMD_LOCAL_NS_CONTAINER_REGISTRY:-ghcr.io/neuronsphere}/hmd-img-k3s-floci:0.2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummykey}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummykey}
    volumes:
      - "${HMD_HOME}/floci/data:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      # Floci 2.0 is a Java/Quarkus image and ships no `python`, so the previous
      # probe could never succeed -- the container sat permanently "unhealthy"
      # while serving fine, which makes `docker ps` actively misleading and would
      # deadlock any future `depends_on: service_healthy`.
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_floci/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      neuronsphere_default:
        aliases:
          - neuronsphere
          - neuronsphere-workload

  # The Deployment GUI (hmd-app-neuronsphere): the Django front end to
  # hmd-ms-deployment, pointed at the local control plane so a local user browses
  # environment BOMs and applies ChangeSets the way they would in the cloud.
  #
  # It is the control plane's own management surface rather than a platform
  # workload, so it runs here beside hmd_db and floci instead of being deployed
  # into an environment's k3s through the deployment DAG. That earlier path
  # needed the cluster, the Traefik-as-alb patch, ext-secrets, a NodePort, an
  # Ingress-host rewrite and an ms-dbaccount round trip before the GUI could
  # serve a page; this one needs a container.
  #
  # `profiles` is what HMD_LOCAL_NEURONSPHERE_ENABLE_GUI=false turns off:
  # environments.ensure_control_plane only sets COMPOSE_PROFILES when
  # bom_seeder.gui_enabled() is true.
  deployment-gui:
    container_name: hmd_deployment_gui
    profiles: ["deployment-gui"]
    # Always set by environments.export_control_plane_compose_env(), which pins
    # the version (environments.GUI_IMAGE_VERSION) and prefers a locally built
    # image over the published one. The default here only applies when compose is
    # driven by hand.
    image: ${HMD_DEPLOYMENT_GUI_IMAGE:-ghcr.io/hmdlabs/hmd-app-neuronsphere:stable}
    restart: unless-stopped
    # No host port: reached at http://localhost:19003/ through hmd_proxy's
    # control-plane vhost (nginx_router.write_control_plane_vhosts).
    environment:
      # These mirror the chart's ConfigMap rendered with the values the local BOM
      # entry used to pass -- oktaAuth false, localHttp true, createLocalSuperuser
      # true -- so the app is configured exactly as it was under Helm.
      DJANGO_SETTINGS_MODULE: deployment_gui.settings.production
      DJANGO_DEBUG: "false"
      # No port in ALLOWED_HOSTS: Django compares the hostname only, and the
      # proxy forwards Host verbatim (there is no Ingress rule to select).
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,hmd_deployment_gui
      CSRF_TRUSTED_ORIGINS: "http://localhost:${HMD_LOCAL_GUI_HOST_PORT:-19003},http://127.0.0.1:${HMD_LOCAL_GUI_HOST_PORT:-19003}"
      # Plain HTTP behind the proxy: turns off the SSL redirect, secure-cookie
      # and HSTS settings, and re-enables username/password login. The chart's
      # `config.localHttp` block, spelled out.
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_SOCIALACCOUNT_ONLY: "false"
      DJANGO_SECRET_KEY: ${HMD_LOCAL_GUI_DJANGO_SECRET_KEY:-django-insecure-local-deployment-gui}
      # The control-plane ms-deployment route, from a plain peer on this network.
      DEPLOYMENT_API_URL: http://hmd_proxy/hmd_ms_deployment
      DEPLOYMENT_API_TIMEOUT: "30"
      SESSION_COOKIE_AGE: "28800"
      # gunicorn.conf.py otherwise sizes to cpu_count()*2+1 and forks dozens of
      # workers on a many-core host.
      GUNICORN_WORKERS: "3"
      # Created by floci_deployer.ensure_core_databases_direct, which follows the
      # local password-equals-username convention.
      DB_HOST: hmd_db
      DB_PORT: "5432"
      DB_NAME: deployment_gui
      DB_USER: deployment_gui
      DB_PASSWORD: deployment_gui
      # MCP server, mounted at /mcp by deployment_gui/asgi.py. It sits beside
      # Django rather than behind it, so it does its own Host/Origin checks.
      # Platform API keys are the local credential path; Okta is not emulated.
      MCP_ENABLED: ${HMD_LOCAL_GUI_MCP_ENABLED:-true}
      MCP_API_KEYS_ENABLED: "true"
      MCP_FEDERATION_ENABLED: "false"
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,hmd_deployment_gui
      MCP_ALLOWED_ORIGINS: "http://localhost:${HMD_LOCAL_GUI_HOST_PORT:-19003}"
      TELEMETRY_SERVICE_URLS: ""
      TELEMETRY_SERVICE_TIMEOUT: "5"
      # Read by `createsuperuser --noinput` below: no Okta locally, so the GUI
      # authenticates against this superuser instead.
      DJANGO_SUPERUSER_USERNAME: ${HMD_LOCAL_GUI_SUPERUSER:-testadmin}
      DJANGO_SUPERUSER_EMAIL: ${HMD_LOCAL_GUI_SUPERUSER_EMAIL:-testadmin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${HMD_LOCAL_GUI_SUPERUSER_PASSWORD:-testpassword}
    # No depends_on: the database is an RDS instance inside Floci, created by
    # the control-plane bootstrap DAG after `compose up` returns, and reachable
    # as `hmd_db` only once its container is aliased. The migrate loop below is
    # what waits for it -- which it already had to do, since the GUI's own
    # database was created after compose returned even when `db` was a service.
    command:
      - /bin/sh
      - -c
      - |
        until python manage.py migrate --noinput; do
          echo "deployment_gui database not ready yet; retrying migrate in 3s"
          sleep 3
        done
        python manage.py createsuperuser --noinput || true
        exec gunicorn --config gunicorn.conf.py deployment_gui.asgi:application
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - neuronsphere_default

networks:
  neuronsphere_default:
    external: true
    name: ${NEURONSPHERE_DOCKER_NETWORK:-neuronsphere_default}
