type: dbt
query_config:
  query_name: by_transform_name_dependent_transform
  query_value:
    dep_tf_name: nsreporting_03_ntc_export_staging_to_final
    tf_name: nsreporting_04_ntc_dbt
config:
  artifact_name: hmd-config-transform-reporting:${repo_version}
  dbt_project_name: hmd_config_transform_reporting
  profile:
    conn_id: trino_conn
    profile_name: nsreporting
    profile_target: default
    profile_mapping: TrinoLDAP
    profile_args:
      database: dbaccount-nsreporting
      schema: "{{ env_var('DBT_SCHEMA') }}"
      environment: "{{ env_var('HMD_ENVIRONMENT') }}"
  env:
    DBT_SCHEMA: "{{ ns_context['schema'] }}"
    HMD_ENVIRONMENT: "{{ ns_context['environment'] }}"
  vars:
    environment: "{{ ns_context['environment'] }}"
  params:
    operator_args: {}
  run_params:
    schema: ntc
    environment: context.environment
