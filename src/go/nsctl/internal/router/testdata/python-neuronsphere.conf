events {
    worker_connections 1024;
}
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    include /etc/nginx/ns/vhost.d/*.conf;
    server {
        listen 80 default_server;
        server_name _;
        include /etc/nginx/ns/http.d/*.conf;
        location / {
            return 404 '{"error": "no route defined"}';
        }
    }
}
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/ns/stream.d/*.conf;
}
