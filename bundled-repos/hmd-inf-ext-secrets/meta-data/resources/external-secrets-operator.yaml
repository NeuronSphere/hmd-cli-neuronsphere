# Produced ResourceDefinition (NERD0004): the External Secrets Operator deployed by this
# repo. A concrete subtype of the base kubernetes.neuronsphere.io/operator (which isa
# deployment), so it satisfies a requirement for either supertype. `produces: true`
# records that this RepoClass emits a Resource of this type when deployed.
resource_namespace: external-secrets.neuronsphere.io
resource_definition_name: external-secrets-operator
version: 0.1.0
description: >-
  The External Secrets Operator -- reconciles ExternalSecret/SecretStore resources,
  syncing secrets from external providers (e.g. AWS Secrets Manager) into the cluster.
resource_metadata:
  provider: external-secrets
parent:
  resource_namespace: kubernetes.neuronsphere.io
  resource_definition_name: operator
  version: 0.1.0
produces: true
role: operator
output_schema:
  type: object
  properties:
    cluster_secret_store_names:
      type: array
      items:
        type: string
      description: The ClusterSecretStores the operator provisions on deploy.
    webhook_internal_dns:
      type: string
      description: >-
        The in-cluster DNS name of the operator's admission webhook Service
        (name.namespace.svc.cluster.local).
