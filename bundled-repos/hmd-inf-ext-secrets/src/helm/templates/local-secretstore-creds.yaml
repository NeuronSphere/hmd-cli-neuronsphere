{{- /*
Local-only static credentials for the AWS ClusterSecretStore(s).

In the cloud the operator authenticates to AWS via IRSA (JWT/serviceAccount).
Locally there is no IAM, so the store uses secretRef auth against these dummy
credentials and the operator's AWS_ENDPOINT_URL (set via extraEnv) redirects the
AWS SDK at the Floci emulator. Only rendered when a *.local flag is set.
*/}}
{{- if and .Values.clusterSecretStore.enabled .Values.clusterSecretStore.local }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clusterSecretStore.credentialsSecretName | default "aws-secrets-manager-local-creds" }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ .Values.clusterSecretStore.localAccessKeyId | default "test" | quote }}
  secret-access-key: {{ .Values.clusterSecretStore.localSecretAccessKey | default "test" | quote }}
{{- end }}
{{- if and .Values.parameterStoreSecretStore.enabled .Values.parameterStoreSecretStore.local }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.parameterStoreSecretStore.credentialsSecretName | default "aws-parameter-store-local-creds" }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ .Values.parameterStoreSecretStore.localAccessKeyId | default "test" | quote }}
  secret-access-key: {{ .Values.parameterStoreSecretStore.localSecretAccessKey | default "test" | quote }}
{{- end }}
