{{/*
NERD0006: declare the produced Resource (external-secrets-operator) as a benign
ConfigMap rendered from the deploy values. `hmd-cli-helm` reads it back after deploy
(via `helm template --show-only`) and submits its `data` to the Deployment Service. It
is a data-only ConfigMap no controller acts on, so it is harmless if applied as part of
the chart by an older `hmd-cli-helm`.

`webhook_internal_dns` exercises the base kubernetes.neuronsphere.io/service primitive:
the cluster-internal URL a consumer would use to reach the operator's webhook.
*/}}
{{- $ns := .Values.namespace_name | default .Release.Namespace -}}
{{- $fullname := include "external-secrets.fullname" . | trim -}}
{{- $stores := list -}}
{{- if and .Values.clusterSecretStore .Values.clusterSecretStore.enabled -}}
{{- $stores = append $stores .Values.clusterSecretStore.name -}}
{{- end -}}
{{- if and .Values.parameterStoreSecretStore .Values.parameterStoreSecretStore.enabled -}}
{{- $stores = append $stores .Values.parameterStoreSecretStore.name -}}
{{- end -}}
{{- $resource := dict
  "resource_name" "external-secrets-operator"
  "resource_definition" (dict
    "resource_namespace" "external-secrets.neuronsphere.io"
    "resource_definition_name" "external-secrets-operator"
    "version" "0.1.0")
  "output" (dict
    "name" $fullname
    "namespace" $ns
    "service_account" (include "external-secrets.serviceAccountName" . | trim)
    "cluster_secret_store_names" $stores
    "webhook_internal_dns" (printf "%s-webhook.%s.svc.cluster.local" $fullname $ns))
  "tags" (list) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-resource-outputs
  namespace: {{ $ns }}
  labels:
    neuronsphere.io/resource-outputs: "true"
data:
  external-secrets-operator: {{ $resource | toJson | quote }}
