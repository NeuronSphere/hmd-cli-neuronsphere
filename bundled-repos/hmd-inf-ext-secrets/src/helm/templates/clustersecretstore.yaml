{{- if .Values.clusterSecretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name | default "aws-secrets-manager" }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
  {{- with .Values.clusterSecretStore.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws_region | default "us-east-1" }}
      {{- if .Values.clusterSecretStore.local }}
      {{- /* Local (Floci) mode: static-credential auth against the emulator.
             No IRSA role is available locally, so authenticate with the dummy
             creds Secret installed alongside the operator. The operator's
             AWS_ENDPOINT_URL (set via extraEnv) points the SDK at Floci. */}}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.clusterSecretStore.credentialsSecretName | default "aws-secrets-manager-local-creds" }}
            key: access-key-id
            namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
          secretAccessKeySecretRef:
            name: {{ .Values.clusterSecretStore.credentialsSecretName | default "aws-secrets-manager-local-creds" }}
            key: secret-access-key
            namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
      {{- else }}
      role: arn:aws:iam::{{ .Values.account }}:role/{{ .Values.env.HMD_INSTANCE_NAME }}-{{ .Values.env.HMD_DID }}-ext-secret
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.env.HMD_INSTANCE_NAME }}-{{ .Values.env.HMD_DID }}
            namespace: {{ .Values.env.HMD_INSTANCE_NAME }}-{{ .Values.env.HMD_DID }}
      {{- end }}
{{- end }}
{{- if .Values.parameterStoreSecretStore.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.parameterStoreSecretStore.name | default "aws-parameter-store" }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
  {{- with .Values.parameterStoreSecretStore.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.aws_region | default "us-east-1" }}
      {{- if .Values.parameterStoreSecretStore.local }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.parameterStoreSecretStore.credentialsSecretName | default "aws-parameter-store-local-creds" }}
            key: access-key-id
            namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
          secretAccessKeySecretRef:
            name: {{ .Values.parameterStoreSecretStore.credentialsSecretName | default "aws-parameter-store-local-creds" }}
            key: secret-access-key
            namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
      {{- else }}
      role: arn:aws:iam::{{ .Values.account }}:role/{{ .Values.env.HMD_INSTANCE_NAME }}-{{ .Values.env.HMD_DID }}-ext-secret
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.env.HMD_INSTANCE_NAME }}-{{ .Values.env.HMD_DID }}
            namespace: {{ .Values.env.HMD_INSTANCE_NAME }}-{{ .Values.env.HMD_DID }}
      {{- end }}
{{- end }}
