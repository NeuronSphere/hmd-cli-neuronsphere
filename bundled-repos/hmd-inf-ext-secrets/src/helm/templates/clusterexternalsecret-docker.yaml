{{- if .Values.dockerRepoSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.dockerRepoSecret.name | default "hmd-docker-repo-secret" }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
  {{- with .Values.dockerRepoSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # The name of the ExternalSecret to be created in each namespace
  externalSecretName: {{ .Values.dockerRepoSecret.name | default "hmd-docker-repo-secret" }}

  # Select ALL namespaces - empty selector matches everything
  namespaceSelector: {}

  # How often to refresh the secret
  refreshTime: {{ .Values.dockerRepoSecret.refreshTime | default "1h" }}

  # The spec for the ExternalSecrets to be created
  externalSecretSpec:
    secretStoreRef:
      name: {{ .Values.dockerRepoSecret.secretStoreName | default (.Values.parameterStoreSecretStore.name | default "aws-parameter-store") }}
      kind: ClusterSecretStore

    target:
      name: {{ .Values.dockerRepoSecret.name | default "hmd-docker-repo-secret" }}
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson

    data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ .Values.dockerRepoSecret.secretKey | default "hmd-docker-repo-secret" }}
        property: {{ .Values.dockerRepoSecret.secretProperty | default "DOCKER_SECRET" }}
{{- end }}
