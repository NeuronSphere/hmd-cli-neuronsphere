{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.env.HMD_INSTANCE_NAME }}-{{ .Values.env.HMD_DID }}
  namespace: {{ .Values.env.HMD_INSTANCE_NAME }}-{{ .Values.env.HMD_DID }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if and .Values.account .Values.env.HMD_INSTANCE_NAME .Values.env.HMD_DID }}
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ .Values.account }}:role/{{ .Values.env.HMD_INSTANCE_NAME }}-{{ .Values.env.HMD_DID }}-ext-secret
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
