# Produced ResourceDefinition (NERD0004): the VPC deployed by this repo. A concrete
# subtype of the base network.neuronsphere.io/network, so a manifest's `resource`-typed
# base-vpc dependency resolves against this repo whether it names the abstract network
# type or the concrete vpc one -- producing a parent type does not satisfy a
# requirement for a child, which is why the parent link matters here.
#
# Until now nothing produced these types for real. `hmd-cli-neuronsphere` declared its
# core instance as the producer of both `network` and `vpc`
# (bom_seeder.CORE_PRODUCED_DEFINITIONS) on the grounds that Docker networking
# substitutes for a VPC locally and "an hmd-vpc deploy is never applicable" -- true when
# written, and no longer: Floci 2.0.1's EC2 creates and persists real VPCs and subnets.
# With this repo deployed as a BOM entry, `base-vpc` resolves to an actual
# VPC-producing RepoInstance in both the cloud and locally, which is the shape the
# cloud has always had.
# The namespace is network.neuronsphere.io, not aws.neuronsphere.io, because that is
# what consumers require: hmd-postgres-rds's `base-vpc` dependency names
# network.neuronsphere.io/vpc. Resolution matches a produced type against the
# requirement and its ancestors, so producing aws.neuronsphere.io/vpc -- whose parent is
# network/network -- would satisfy a requirement for `network` and NOT one for `vpc`,
# leaving hmd-postgres-rds unresolvable. Declaring network/vpc with network/network as
# its parent satisfies both.
resource_namespace: network.neuronsphere.io
resource_definition_name: vpc
version: 0.1.0
description: >-
  An Amazon VPC, including its subnets and the DB subnet group instances in it
  are placed into.
resource_metadata:
  provider: aws
parent:
  resource_namespace: network.neuronsphere.io
  resource_definition_name: network
  version: 0.1.0
produces: true
role: network
output_schema:
  type: object
  required:
    - vpc_id
  properties:
    vpc_id:
      type: string
      description: The id of the VPC.
    cidr_block:
      type: string
      description: The VPC's CIDR block.
    subnet_ids:
      type: array
      description: The subnets created in the VPC.
      items:
        type: string
    db_subnet_group_name:
      type: string
      description: >-
        The DB subnet group RDS instances in this VPC are placed into. Named
        explicitly rather than relying on the implicit "default" group, which is
        built by listing the subnets of vpc-default-<region> in the calling
        account -- something Floci seeds only for the first account to touch EC2.
