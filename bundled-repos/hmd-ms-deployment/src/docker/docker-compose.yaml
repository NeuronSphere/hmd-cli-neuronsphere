version: "3.2"
services:
  hmd_ms_deployment:
    image: ghcr.io/hmdlabs/hmd-ms-deployment:0.1.91
    container_name: hmd_ms_deployment
    environment:
      HMD_CUSTOMER_CODE: ${HMD_CUSTOMER_CODE}
      HMD_DB_HOST: db
      HMD_DB_NAME: hmd_ms_deployment
      HMD_DB_PASSWORD: hmd_ms_deployment
      HMD_DB_USER: hmd_ms_deployment
      HMD_DID: ${HMD_DID}
      HMD_ENVIRONMENT: ${HMD_ENVIRONMENT}
      HMD_REGION: ${HMD_REGION}
      OPERATIONS_MODULE: hmd_ms_deployment.deployment_ops
      SCHEMA_URI: /schemas
    expose:
      - 8080
    volumes:
      - type: bind
        source: ${HMD_REPO_HOME}/hmd-lang-deployment/src/schemas
        target: /schemas/
    depends_on:
      - db
  hmd_ms_deployment_dynamo:
    image: ghcr.io/hmdlabs/hmd-ms-deployment:0.1.86
    container_name: hmd_ms_deployment_dynamo
    environment:
      AWS_ACCESS_KEY_ID: 'DUMMYIDEXAMPLE'
      AWS_DEFAULT_REGION: 'us-west-2'
      AWS_SECRET_ACCESS_KEY: 'DUMMYEXAMPLEKEY'
      HMD_CUSTOMER_CODE: ${HMD_CUSTOMER_CODE}
      HMD_DID: ${HMD_DID}
      HMD_DYNAMODB_TABLE: hmd_ms_deployment
      HMD_DYNAMODB_URL: http://dynamodb:8000
      HMD_ENVIRONMENT: ${HMD_ENVIRONMENT}
      HMD_REGION: ${HMD_REGION}
      OPERATIONS_MODULE: hmd_ms_deployment.deployment_ops
      SCHEMA_URI: /schemas
    expose:
      - 8080
    volumes:
      - type: bind
        source: ${HMD_REPO_HOME}/hmd-lang-deployment/src/schemas
        target: /schemas/
    depends_on:
      - dynamodb
