# Base ResourceDefinition (NERD0004): a relational PostgreSQL database. A subtype
# of database.neuronsphere.io/database.
resource_namespace: database.neuronsphere.io
resource_definition_name: postgres
version: 0.1.0
description: >-
  A PostgreSQL relational database (or a named database/account on a PostgreSQL
  cluster).
parent:
  resource_namespace: database.neuronsphere.io
  resource_definition_name: database
  version: 0.1.0
output_schema:
  type: object
  properties:
    database_name:
      type: string
      description: The name of the logical database.
    secret_name:
      type: string
      description: The name of the secret holding the connection credentials.
    engine_version:
      type: string
      description: The PostgreSQL engine version.
