# Base ResourceDefinition (NERD0004): an abstract secret / credential.
resource_namespace: credentials.neuronsphere.io
resource_definition_name: credential
version: 0.1.0
description: >-
  A stored secret or credential (e.g. a username/password, API key, or certificate)
  that other resources consume.
output_schema:
  type: object
  required:
    - secret_name
  properties:
    secret_name:
      type: string
      description: The name of the secret.
    secret_arn:
      type: string
      description: The provider identifier of the secret.
