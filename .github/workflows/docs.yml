name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go/nsctl/go.mod
      - run: make docs-reference-check
      - uses: actions/configure-pages@v5
      - name: Install Bartleby
        # bartleby is a Go CLI (hmd-cli-bartleby), not a PyPI package: its
        # Homebrew cask is macOS-only, so Linux runners take the release
        # tarball directly.
        run: |
          VERSION=2.1.0
          curl -fsSL "https://github.com/neuronsphere/hmd-cli-bartleby/releases/download/v${VERSION}/bartleby_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp bartleby
          sudo install -m 755 /tmp/bartleby /usr/local/bin/bartleby
      - name: Pull the Bartleby transform image
        # bartleby only creates a container from its transform image, it never
        # pulls one -- a dev machine already has it from a prior run, but a
        # fresh runner needs this first. The image is public; no login needed.
        run: bartleby update-image
      - name: Render documentation
        run: bartleby html
      - name: Validate rendered site
        run: test -f target/bartleby/html/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/bartleby/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
