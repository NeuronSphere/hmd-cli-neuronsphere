# What NERD002's Phase 0 entry claimed had landed. `make check` existed and was
# commented "the CI target"; nothing ran it. This does.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # `make generate` fetches the ten repo trees the binary embeds from the
    # artifact librarian -- they are pinned in meta-data/manifest.json as
    # pre_build_artifacts and are not committed. Every make target below
    # depends on it, so the credential belongs on the job rather than on one
    # step. The API key is the CI path through librarian.New; a developer's
    # `hmd login` token is the other.
    env:
      HMD_ARTIFACT_LIBRARIAN_URL: ${{ secrets.HMD_ARTIFACT_LIBRARIAN_URL }}
      HMD_ARTIFACT_LIBRARIAN_API_KEY: ${{ secrets.HMD_ARTIFACT_LIBRARIAN_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go/nsctl/go.mod

      # Keyed on the pins, so only a version bump costs a download. The cache
      # is what repopack writes: src/go/nsctl/.artifacts/<class>@<version>.
      - uses: actions/cache@v4
        with:
          path: src/go/nsctl/.artifacts
          key: repo-artifacts-${{ hashFiles('meta-data/manifest.json') }}

      # gofmt, vet and the unit tests. `generate` runs first as a dependency of
      # every one of these targets: the embedded compose file, runner sources
      # and repo trees are not committed.
      - run: make check

      - run: make test-race

      - run: make build

      # The contract suite: what nsctl must do on a machine with no Docker, no
      # control plane and no HMD_HOME. Robot Framework is not a Go dependency,
      # so it is installed here rather than assumed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install robotframework

      - run: make test-cli
