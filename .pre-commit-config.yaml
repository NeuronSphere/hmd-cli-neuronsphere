repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v2.27.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
      - id: black
        files: src/python
        # bundled-repos/ holds verbatim copies of other repositories' trees,
        # embedded into the binary so a distributed nsctl can deploy without a
        # checkout. Reformatting them here would fork them from upstream and
        # make `make refresh-bundled-repos` a diff every time.
        exclude: ^bundled-repos/
  - repo: https://github.com/prettier/pre-commit
    rev: 57f39166b5a5a504d6808b87ab98d41ebf095b46
    hooks:
      - id: prettier
        files: src/typescript/
